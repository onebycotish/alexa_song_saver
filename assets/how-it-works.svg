<svg xmlns="http://www.w3.org/2000/svg" width="360" height="420" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
  <title id="title">How Song Saver works</title>
  <desc id="desc">You say "like this song" or "remove this song" to your Echo. Alexa passes it to Song Saver, your private Alexa-hosted skill, which asks Spotify for the Current Track and adds it to or removes it from Liked Songs. Alexa then says which song was saved or removed.</desc>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.25; }
      .accent { fill: #e9f8ee; stroke: #1db954; stroke-width: 1.5; }
      .line { fill: none; stroke: #8c959f; stroke-width: 1.25; }
      .reply { fill: none; stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 4 4; }
      .head { fill: #8c959f; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .name { fill: #1f2328; font-size: 15px; font-weight: 600; }
      .note { fill: #656d76; font-size: 11.5px; }
      /* Text outside the boxes: GitHub picks the scheme from the OS, not the page, so it must read on both. */
      .free { fill: #7d8590; }
      .say { font-size: 12px; font-style: italic; }
      @media (prefers-color-scheme: dark) {
        .box { fill: #161b22; stroke: #30363d; }
        .accent { fill: #10281a; }
        .line, .reply { stroke: #6e7681; }
        .head { fill: #6e7681; }
        .name { fill: #e6edf3; }
        .note { fill: #8d96a0; }
        .free { fill: #7d8590; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 1 L9 5 L0 9 z"/>
    </marker>
  </defs>

  <!-- You -->
  <rect class="box" x="24" y="12" width="240" height="56" rx="12"/>
  <text class="name" x="144" y="36" text-anchor="middle">You</text>
  <text class="note" x="144" y="55" text-anchor="middle">"Alexa, ask song saver to…"</text>

  <line class="line" x1="144" y1="68" x2="144" y2="130" marker-end="url(#arrow)"/>
  <text class="say free" x="156" y="95">like this song</text>
  <text class="say free" x="156" y="112">remove this song</text>

  <!-- Echo -->
  <rect class="box" x="24" y="132" width="240" height="56" rx="12"/>
  <text class="name" x="144" y="156" text-anchor="middle">Echo</text>
  <text class="note" x="144" y="175" text-anchor="middle">Alexa hears the phrase</text>

  <line class="line" x1="144" y1="188" x2="144" y2="226" marker-end="url(#arrow)"/>

  <!-- Song Saver -->
  <rect class="box" x="24" y="228" width="240" height="56" rx="12"/>
  <text class="name" x="144" y="252" text-anchor="middle">Song Saver</text>
  <text class="note" x="144" y="271" text-anchor="middle">your private Alexa-hosted skill</text>

  <line class="line" x1="144" y1="284" x2="144" y2="322" marker-end="url(#arrow)"/>

  <!-- Spotify -->
  <rect class="accent" x="24" y="324" width="240" height="56" rx="12"/>
  <text class="name" x="144" y="348" text-anchor="middle">Spotify</text>
  <text class="note" x="144" y="367" text-anchor="middle">Current Track → Liked Songs</text>

  <!-- Spoken reply back to You -->
  <path class="reply" d="M264 352 H310 Q318 352 318 344 V48 Q318 40 310 40 H268" marker-end="url(#arrow)"/>
  <text class="note free" transform="translate(336 196) rotate(90)" text-anchor="middle">"Saved / Removed {song}"</text>

  <text class="note free" x="144" y="408" text-anchor="middle">Then Alexa ends, and your music carries on.</text>
</svg>
